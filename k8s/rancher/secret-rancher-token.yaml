# Rancher API token for Prometheus to scrape Rancher metrics.
# Fill in the token AFTER Rancher is installed and you have logged in:
#   Rancher UI → top-right avatar → API Keys → Add Key → copy the Bearer Token
# Then apply:  kubectl apply -f K8s/rancher/secret-rancher-token.yaml
#              kubectl rollout restart deployment/prometheus-monitoring -n monitor

apiVersion: v1
kind: Secret
metadata:
  name: rancher-token
  namespace: monitor
type: Opaque
stringData:
  token: "<PASTE_RANCHER_BEARER_TOKEN_HERE>"
