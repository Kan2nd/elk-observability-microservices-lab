apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos-api
  namespace: app
  labels:
    app: todos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todos-api
  template:
    metadata:
      labels:
        app: todos-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-app
      containers:
      - name: todos-api
        image: kan2nd/microapp:todos-api-redis
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8082
          protocol: TCP
        env:
        - name: TODO_API_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: TODO_API_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_REDIS_PORT
        - name: REDIS_CHANNEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CHANNEL
        - name: ZIPKIN_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ZIPKIN_URL
        # APM agent sends traces to fleet-server APM intake
        - name: ELASTIC_APM_SERVER_URL
          value: "http://fleet-server.monitor.svc.cluster.local:8200"
        - name: ELASTIC_APM_SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: elastic-apm-secret
              key: apm-secret-token
        - name: ELASTIC_APM_SERVICE_NAME
          value: "todos-api"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        # todos-api has NO /health route (routes are /todos and /todos/:taskId, JWT-protected).
        # Use TCP probe — just checks that the Express server is accepting connections.
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
