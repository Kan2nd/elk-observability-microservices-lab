apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: app
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    dir /data

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: app
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-app
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5

      # Sidecar that exposes Redis metrics on :9121/metrics for Prometheus scraping.
      # Redis itself has no built-in /metrics endpoint.
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.62.0-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9121
          protocol: TCP
        env:
        - name: REDIS_ADDR
          value: "redis://localhost:6379"
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"

      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
      - name: redis-config
        configMap:
          name: redis-config

---
# NodePort so host-based Elastic Agent (systemd) can scrape Redis exporter
# from outside the cluster. URL: http://192.168.96.136:30781/metrics
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter-nodeport
  namespace: app
  labels:
    app: redis
spec:
  type: NodePort
  ports:
  - name: metrics
    port: 9121
    targetPort: 9121
    nodePort: 30781
  selector:
    app: redis

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: app
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
