apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-collector-config
  namespace: app
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush              1
        Daemon             Off
        Log_Level          info
        Parsers_File       parsers.conf

    # Tail all container logs on the node — containerd writes CRI-format logs
    [INPUT]
        Name               tail
        Path               /var/log/containers/*.log
        Parser             cri
        Tag                kube.<namespace_name>.<pod_name>.<container_name>
        Tag_Regex          (?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-(?<docker_id>[a-z0-9]{64})\.log$
        Refresh_Interval   5
        Mem_Buf_Limit      5MB
        Skip_Long_Lines    On

    # Stitch multi-line Java stack traces into a single record before k8s enrichment.
    # Uses Fluent-Bit's built-in 'java' multiline parser which recognises Spring Boot
    # log prefixes (timestamp + level) as line starters and '    at / Caused by:' as
    # continuations.  Must run BEFORE the kubernetes filter so each stitched record
    # is enriched once, not per-fragment.
    [FILTER]
        Name                  multiline
        Match                 kube.*
        multiline.key_content log
        multiline.parser      java

    # Enrich logs with Kubernetes pod/namespace/label metadata
    [FILTER]
        Name               kubernetes
        Match              kube.*
        Kube_URL           https://kubernetes.default.svc:443
        Kube_CA_File       /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File    /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix    kube.
        Merge_Log          On
        Keep_Log           On
        Labels             On
        Annotations        Off

    # Forward enriched logs to the fluent-bit receiver on k8s-moni
    [OUTPUT]
        Name               forward
        Match              kube.*
        Host               fluent-bit-receiver.monitor.svc.cluster.local
        Port               24224
        Retry_Limit        5

  parsers.conf: |
    [PARSER]
        Name               cri
        Format             regex
        Regex              ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key           time
        Time_Format        %Y-%m-%dT%H:%M:%S.%L%z

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-collector
  namespace: app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-collector
rules:
- apiGroups: [""]
  resources:
  - pods
  - namespaces
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - replicasets
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-collector
subjects:
- kind: ServiceAccount
  name: fluent-bit-collector
  namespace: app

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-collector
  namespace: app
  labels:
    app: fluent-bit-collector
spec:
  selector:
    matchLabels:
      app: fluent-bit-collector
  template:
    metadata:
      labels:
        app: fluent-bit-collector
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-app
      serviceAccountName: fluent-bit-collector
      terminationGracePeriodSeconds: 10
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.1.8
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 2020
          protocol: TCP
        volumeMounts:
        # /var/log covers both /var/log/containers (symlinks) and /var/log/pods (actual files)
        # containerd does NOT use /var/lib/docker/containers
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "200Mi"
            cpu: "100m"
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: config
        configMap:
          name: fluent-bit-collector-config
