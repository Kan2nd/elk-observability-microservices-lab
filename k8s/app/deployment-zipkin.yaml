apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: app
  labels:
    app: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-app
      containers:
      - name: zipkin
        image: openzipkin/zipkin:3.4
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9411
          protocol: TCP
        env:
        - name: STORAGE_TYPE
          value: "mem"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9411
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9411
          initialDelaySeconds: 10
          periodSeconds: 5
