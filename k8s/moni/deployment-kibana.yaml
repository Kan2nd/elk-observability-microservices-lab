apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:9.3.1
        resources:
          limits:
            memory: 1Gi
        ports:
        - containerPort: 5601
        env:
        - name: SERVERNAME
          value: "kibana"
        - name: ELASTICSEARCH_HOSTS
          value: "https://es01:9200"
        - name: ELASTICSEARCH_USERNAME
          value: "kibana_system"
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: KIBANA_PASSWORD
        - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
          value: "config/certs/ca/ca.crt"
        - name: XPACK_SECURITY_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: ENCRYPTION_KEY
        - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: ENCRYPTION_KEY
        - name: XPACK_REPORTING_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: ENCRYPTION_KEY
        - name: SERVER_SSL_ENABLED
          value: "true"
        - name: SERVER_SSL_CERTIFICATE
          value: "config/certs/kibana/kibana.crt"
        - name: SERVER_SSL_KEY
          value: "config/certs/kibana/kibana.key"
        - name: SERVER_SSL_CERTIFICATEAUTHORITIES
          value: "config/certs/ca/ca.crt"
        - name: ELASTIC_APM_SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: ELASTIC_APM_SECRET_TOKEN
        volumeMounts:
        - name: certs
          mountPath: /usr/share/kibana/config/certs
        - name: kibanadata
          mountPath: /usr/share/kibana/data
        - name: kibana-config
          mountPath: /usr/share/kibana/config/kibana.yml
          subPath: kibana.yml
      volumes:
      - name: certs
        secret:
          secretName: elastic-certs
          items:
          - key: ca.crt
            path: ca/ca.crt
          - key: kibana.crt
            path: kibana/kibana.crt
          - key: kibana.key
            path: kibana/kibana.key
      - name: kibanadata
        persistentVolumeClaim:
          claimName: kibanadata
      - name: kibana-config
        configMap:
          name: kibana-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kibanadata
  namespace: monitor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: monitor
spec:
  selector:
    app: kibana
  ports:
  - port: 5601
    targetPort: 5601
