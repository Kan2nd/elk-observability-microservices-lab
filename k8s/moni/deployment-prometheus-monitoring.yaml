apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-monitoring-config
  namespace: monitor
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    # remote_write to ES is not possible due to a snappy encoding incompatibility:
    # Prometheus (Go snappy.Encode) always sends snappy BLOCK format.
    # ES 9.3.1 Netty HttpContentDecoder always uses SnappyFrameDecoder (FRAMING format).
    # These two formats are fundamentally incompatible. No Prometheus config option
    # changes the snappy variant used — protobuf_message only changes the protobuf schema.
    # Use Prometheus UI (http://192.168.96.136:30900) to view all scraped metrics.
    # To get metrics into Kibana: use Fleet → Add integration → Prometheus (Elastic Agent
    # scrapes kube-state-metrics endpoint directly, bypassing remote_write entirely).

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    # Redis metrics via redis-exporter sidecar on port 9121
    - job_name: 'redis'
      static_configs:
      - targets: ['redis.app.svc.cluster.local:9121']

    # kube-state-metrics — pod health, deployment replica counts, restart counts
    # Exposes: kube_pod_status_phase, kube_deployment_status_replicas_unavailable,
    #          kube_pod_container_status_restarts_total, kube_node_status_condition
    - job_name: 'kube-state-metrics'
      static_configs:
      - targets: ['kube-state-metrics.monitor.svc.cluster.local:8080']

    # kubelet cAdvisor — per-pod CPU and memory usage
    # Routes through the Kubernetes API server proxy so no direct node port access needed.
    # Exposes: container_cpu_usage_seconds_total, container_memory_working_set_bytes
    # Labels on every metric: namespace, pod, container — so you can filter by app/pod.
    - job_name: 'kubelet-cadvisor'
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-monitoring
  namespace: monitor
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.11.3-distroless
        imagePullPolicy: IfNotPresent
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=7d'
        - '--web.enable-lifecycle'
        - '--enable-feature=native-histograms'
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: prometheus-monitoring-config
      - name: storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitor
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: prometheus

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitor

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitor
