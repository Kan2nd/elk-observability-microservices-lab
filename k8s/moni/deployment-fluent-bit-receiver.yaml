apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-receiver-config
  namespace: monitor
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush              1
        Daemon             Off
        Log_Level          info

    # Receives logs forwarded from fluent-bit on k8s-app via the forward protocol
    [INPUT]
        Name               forward
        Listen             0.0.0.0
        Port               24224
        Tag                forwarded.*

    [FILTER]
        Name               modify
        Match              forwarded.*
        Add                observer.type fluent-bit-receiver

    [OUTPUT]
        Name               es
        Match              forwarded.*
        Host               es01.monitor.svc.cluster.local
        Port               9200
        HTTP_User          elastic
        HTTP_Passwd        ${ELASTIC_PASSWORD}
        Index              app-logs
        Logstash_Format    On
        Logstash_Prefix    app
        Logstash_DateFormat %Y.%m.%d
        Time_Key           @timestamp
        Suppress_Type_Name On
        Generate_ID        On
        Retry_Limit        5
        tls                On
        tls.verify         On
        tls.ca_file        /certs/ca/ca.crt

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-receiver
  namespace: monitor

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-receiver
  namespace: monitor
  labels:
    app: fluent-bit-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit-receiver
  template:
    metadata:
      labels:
        app: fluent-bit-receiver
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      serviceAccountName: fluent-bit-receiver
      terminationGracePeriodSeconds: 10
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.1.8
        imagePullPolicy: IfNotPresent
        ports:
        - name: forward-tcp
          containerPort: 24224
          protocol: TCP
        - name: forward-udp
          containerPort: 24224
          protocol: UDP
        env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: ELASTIC_PASSWORD
        volumeMounts:
        - name: config
          mountPath: /fluent-bit/etc/
        - name: certs
          mountPath: /certs
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: config
        configMap:
          name: fluent-bit-receiver-config
      - name: certs
        secret:
          secretName: elastic-certs
          items:
          - key: ca.crt
            path: ca/ca.crt

---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit-receiver
  namespace: monitor
  labels:
    app: fluent-bit-receiver
spec:
  type: ClusterIP
  selector:
    app: fluent-bit-receiver
  ports:
  - name: forward-tcp
    port: 24224
    targetPort: 24224
    protocol: TCP
  - name: forward-udp
    port: 24224
    targetPort: 24224
    protocol: UDP
