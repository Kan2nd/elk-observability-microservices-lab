apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "10s"

  - name: Elasticsearch
    type: elasticsearch
    uid: elasticsearch
    access: proxy
    url: https://es01:9200
    editable: false
    basicAuth: true
    basicAuthUser: elastic
    secureJsonData:
      basicAuthPassword: "${ELASTIC_PASSWORD}"
    jsonData:
      # Grafana connects over the internal Docker network; the CA cert is
      # not available to Grafana directly so we skip TLS verification.
      # For production, mount the CA and set tlsCACert instead.
      tlsSkipVerify: true
      timeField: "@timestamp"
      logMessageField: "log"
      logLevelField: "level"
      index: "host-java-logs"
      interval: Daily
      esVersion: "8.0.0"
