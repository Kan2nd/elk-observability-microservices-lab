# Elastic APM Java Agent Configuration
# Place this file in the classpath or reference via ELASTIC_APM_CONFIG_FILE

# Service Configuration
service_name=users-api
service_version=1.0.0
environment=docker

# APM Server Configuration
server_url=http://elastic-agent:8200

# Instrumentation Configuration
enabled=true
instrument=true
service_node_name=${HOSTNAME}

# Sampling Configuration
transaction_sample_rate=1.0
metrics_interval=10s

# Logging Configuration
log_level=INFO
log_file=System.err

# Reporting Configuration
enable_log_correlation=true
enable_sql_parser=true
capture_body=errors

# Metrics Configuration
enable_metrics=true
metrics_tags=environment=docker

# Transaction Configuration
transaction_max_spans=1000
span_min_duration=0ms
breakdown_metrics=true

# Error Configuration
capture_exception_details=true
