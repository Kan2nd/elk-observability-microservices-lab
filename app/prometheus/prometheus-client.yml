# Prometheus Configuration for App VM
# Scrapes metrics from local services and forwards to Monitor Machine Prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    prometheus_instance: "app-vm"
    environment: "docker-app"

# ==================== REMOTE WRITE ====================
# Push metrics to monitor machine Prometheus
# NOTE: Use the actual IP address of your monitor machine (e.g., 192.168.1.100)
remote_write:
  - url: "http://192.168.96.130:9090/api/v1/write"  # ← REPLACE with your MONITOR_VM_IP!
    write_relabel_configs:
      - source_labels: []
        target_label: cluster
        replacement: "docker-app"

# ==================== SCRAPE CONFIGURATIONS ====================

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Users API (Java Spring Boot) - Prometheus metrics via Actuator
  - job_name: "users-api"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["users-api:8083"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: []
        target_label: service
        replacement: "users-api"

  # Auth API (Go)
  - job_name: "auth-api"
    static_configs:
      - targets: ["auth-api:8081"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: []
        target_label: service
        replacement: "auth-api"

  # Todos API (Node.js)
  - job_name: "todos-api"
    static_configs:
      - targets: ["todos-api:8082"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: []
        target_label: service
        replacement: "todos-api"

  # Zipkin
  - job_name: "zipkin"
    metrics_path: /metrics
    static_configs:
      - targets: ["zipkin:9411"]
    scrape_interval: 30s
