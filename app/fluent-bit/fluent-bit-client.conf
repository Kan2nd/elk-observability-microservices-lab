[SERVICE]
    Flush              5
    Daemon             Off
    Log_Level          info
    HTTP_Server        On
    HTTP_Listen        0.0.0.0
    HTTP_Port          2020
    Health_Check       On

# ==================== INPUTS ====================

# Forward plugin receives logs from Docker logging driver
[INPUT]
    Name               forward
    Listen             0.0.0.0
    Port               24224
    Tag                docker.*

# ==================== FILTERS ====================

# Add metadata to all logs
[FILTER]
    Name               modify
    Match              docker.*
    Add                container.platform docker
    Add                observer.type fluent-bit

# ==================== OUTPUTS ====================

# Forward to Monitor Machine Fluent-bit
[OUTPUT]
    Name               forward
    Match              docker.*
    Host               ${MONITOR_VM_IP:-10.10.10.10}
    Port               24224
    Send_options       true
    Retry_Limit        5

# Also output to stdout for debugging (optional)
[OUTPUT]
    Name               stdout
    Match              docker.*
    Format             json_lines
